name: Eval

on:
  push:

jobs:
  ringbuffer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          cd crates/eval
          docker build --platform=linux/amd64 --no-cache --pull -f docker/Dockerfile -t no-seatbelts-eval-env .

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Run eval on ring_buffer
        run: |
          cd crates/eval
          cargo run -p eval --bin eval ring-buffer
      
      - name: Upload panic metrics
        uses: actions/upload-artifact@v4
        with:
          name: ring-buffer-panic-metrics
          path: crates/eval/build/

  survey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          cd crates/eval
          docker build --platform=linux/amd64 --no-cache --pull -f docker/Dockerfile -t no-seatbelts-eval-env .

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Run survey
        run: |
          cd crates/eval
          cargo run -p eval --bin eval survey
      
      - name: Upload panic metrics
        uses: actions/upload-artifact@v4
        with:
          name: survey-panic-metrics
          path: crates/eval/build/


